<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <p class="auth-brand">ARM <span>SERVICES</span> NELLORE</p>
    <h1>Change Password</h1>
    <p class="auth-hint">Enter your current password, then set a new one.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label>Current password
        <input type="password" name="old_password" required>
      </label>
      <label>New password
        <input type="password" name="new_password" required minlength="8">
      </label>
      <label>Confirm new password
        <input type="password" name="confirm_password" required minlength="8">
      </label>
      <button type="submit" class="btn-primary">Update password</button>
    </form>
    <a class="auth-back" href="{{ url_for('admin_dashboard') }}">← Back to dashboard</a>
  </div>
</body>
</html>
